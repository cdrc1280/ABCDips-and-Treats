name: abcdips

# ═══════════════════════════════════════════════════════════════════════════════
# DATA PERSISTENCE STRATEGY
# ═══════════════════════════════════════════════════════════════════════════════
# Every deployment rebuilds the app image — but persistent data lives in
# named Docker volumes that SURVIVE rebuilds and container restarts:
#
#   db_data      → MySQL database (all orders, products, users, settings, etc.)
#   app_storage  → Uploaded files (product images, avatars, invoices, media)
#   app_logs     → Laravel application logs (for debugging production issues)
#
# NEVER run: docker-compose down -v   ← this deletes volumes and ALL data!
# SAFE to run: docker-compose up -d --build  ← rebuilds image, keeps volumes
# ═══════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    container_name: abcdips_app
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_NAME: "ABCDips & Treats"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: abcdips
      DB_USERNAME: abcdips_user
      DB_PASSWORD: abcdips_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Uploaded product images, avatars, invoices, and all media files
      - app_storage:/var/www/html/storage/app
      # Application logs — persisted so you can debug issues after redeploy
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: abcdips_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: abcdips
      MYSQL_USER: abcdips_user
      MYSQL_PASSWORD: abcdips_password
    volumes:
      # ALL database data — orders, products, users, settings, etc.
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abcdips_redis
    restart: always
    volumes:
      # Redis data persistence — preserves queue jobs and cache across restarts
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:      # MySQL — all business data
  app_storage:  # Uploaded files — product images, media, invoices
  app_logs:     # Laravel logs — for post-deploy debugging
  redis_data:   # Redis — queue jobs and session/cache data
