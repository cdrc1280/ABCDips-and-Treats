# ─── HTTP → HTTPS redirect (handles plain-text requests before they reach app) ─
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # Health check endpoint — must work over HTTP for Railway/PaaS load balancers
    location /up {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS / Application Server ────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # ─── Request limits ─────────────────────────────────────────
    client_max_body_size 20M;     # Reduced from 100M — sufficient for product images
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 30s;

    sendfile on;
    tcp_nopush on;
    server_tokens off;            # Do not expose Nginx version

    # ─── Block dangerous HTTP methods ───────────────────────────
    # Only allow methods the app actually uses. TRACE/TRACK enable XST attacks.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ─── Security headers (defense-in-depth alongside Laravel middleware) ────
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-DNS-Prefetch-Control    "off"                           always;

    # ─── SPA + API routing ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire / Filament dynamic assets
    location /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ────────────────────────────────────────────────
    location ~ \.php$ {
        # Prevent path traversal: only serve actual PHP files that exist
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;

        # Do not expose PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # ─── Static assets — long cache with immutable hint ─────────
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Block sensitive paths ───────────────────────────────────
    # Deny access to dotfiles (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny direct access to PHP files outside public root
    location ~* \.(sh|bash|sql|log|env|lock|json|md|yaml|yml|xml|ini|config)$ {
        deny all;
        return 404;
    }

    # Block access to storage/app and other sensitive Laravel directories
    location ~* ^/(storage/app|bootstrap/cache|vendor|node_modules|tests|database) {
        deny all;
        return 404;
    }
}
