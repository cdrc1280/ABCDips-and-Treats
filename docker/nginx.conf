# ─── Main Application Server ─────────────────────────────────────────────────
# TLS termination is handled by the PaaS load balancer (Railway, Render, Fly.io).
# This server block handles HTTP only — the PaaS forwards HTTPS → HTTP internally.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # ─── Request limits ─────────────────────────────────────────
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 30s;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # ─── Block dangerous HTTP methods ───────────────────────────
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ─── Security headers (defense-in-depth alongside Laravel middleware) ────
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-DNS-Prefetch-Control    "off"                           always;

    # ─── Health check endpoint — must work for PaaS load balancers ──────────
    location /up {
        try_files $uri /index.php?$query_string;
    }

    # ─── SPA + API routing ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire / Filament dynamic assets
    location /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;

        # Do not expose PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # ─── Static assets — long cache with immutable hint ─────────
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Block sensitive paths ───────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(sh|bash|sql|log|env|lock|json|md|yaml|yml|xml|ini|config)$ {
        deny all;
        return 404;
    }

    location ~* ^/(storage/app|bootstrap/cache|vendor|node_modules|tests|database) {
        deny all;
        return 404;
    }
}
